<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de administrcion - Food Store</title>
</head>
<body>
    <header>
        <h1>Panel de administracion</h1>
        <nav>
            <a href="index.html">Volver a la tienda</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Gestion de productos</h2>
            <!--Tabla de productos-->
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td><img src="./imagenes/hamburguesa.jpg" alt="Hamburguesa" width="70" height="70"></td>
                        <td>Hamburguesa Triple</td>
                        <td>Hamburguesas</td>
                        <td>$25000</td>
                        <td>12</td>
                        <td><a href="#">Editar</a> | <a href="#">Eliminar</a></td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td><img src="./imagenes/pizza.jpg" alt="Pizza" width="70" height="70"></td>
                        <td>Pizza de Muzzarella</td>
                        <td>Pizzas</td>
                        <td>$18000</td>
                        <td>5</td>
                        <td><a href="#">Editar</a> | <a href="#">Eliminar</a></td>
                    </tr>
                </tbody>
            </table>
        </section>
        <hr>
        <section>
            <!--Formulario de carga rapida-->
            <details open>
                <summary><strong>Agregar producto</strong></summary>
                <form>
                    <p>
                        <label>Nombre del producto:</label><br>
                        <input type="text" placeholder="Ej: Lomito completo" required>
                    </p>
                    <p>
                        <label>Precio:</label><br>
                        <input type="number" placeholder="$" step="1" required>
                    </p>
                    <p>
                        <label>Categoria:</label><br>
                        <select>
                            <option value="" disabled selected></option>
                            <option value="hamburguesas">Hamburguesas</option>
                            <option value="pizzas">Pizzas</option>
                            <option value="bebidas">Bebidas</option>
                        </select>
                    </p>
                    <button type="submit">Guardar producto</button>
                </form>
            </details>
        </section>
    </main>

    <footer>
        <p>Panel de Administración - Food Store v1.0</p>
    </footer>
</body>
</html>
