<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - FoodStore</title>
    <link rel="stylesheet" href="../../../style.css">
    <link rel="stylesheet" href="../registro/registro.css"> </head>
<body>
    <main class="auth-container">
        <form id="register-form" class="auth-card">
            <h1>Crear Cuenta</h1>
            <p>Completá tus datos para empezar a comprar.</p>

            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="tu@email.com">
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="mínimo 6 caracteres">
            </div>

            <div class="input-group">
                <label for="rol">¿Quién sos?</label>
                <select id="rol">
                    <option value="client">Cliente</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>

            <button type="submit" class="btn-auth">Registrarse</button>
            
            <p class="auth-footer">
                ¿Ya tenés cuenta? <a href="../login/login.html">Iniciá sesión acá</a>
            </p>
        </form>
    </main>
    <script type="module" src="./registro.ts"></script>
</body>
</html>
