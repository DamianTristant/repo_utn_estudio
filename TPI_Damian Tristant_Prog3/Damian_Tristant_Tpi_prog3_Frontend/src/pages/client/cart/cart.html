<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - Food Store</title>
    <link rel="stylesheet" href="../../../styles.css">
    <link rel="stylesheet" href="./cart.css">
</head>
<body>
    <header class="main-header">
        <div class="header-container">
            <h1>Food<span>Store</span></h1>
            <nav>
                <a href="../home/home.html" class="nav-link">⬅ Volver a la Tienda</a>
            </nav>
        </div>
    </header>

    <main class="cart-page">
        <section class="cart-content">
            <div class="cart-header">
                <h2>Tu Pedido</h2>
                <button id="clear-cart-btn" class="btn-text">Vaciar carrito</button>
            </div>
            <div id="cart-items" class="items-list">
                <!-- Se llena con JS -->
            </div>
        </section>

        <aside class="cart-sidebar">
            <h3>Resumen</h3>
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="cart-total">$0</span>
            </div>
            <div class="summary-row total">
                <span>Total</span>
                <span id="cart-total-final">$0</span>
            </div>
            <button id="checkout-btn" class="btn-primary">Finalizar Compra</button>
        </aside>
    </main>

    <script type="module" src="./cart.ts"></script>
</body>
</html>
