<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Registro</title>
    <link rel="stylesheet" href="../../../../css/styles.css">
</head>
<body>
    <div class="container">
        <form id="form-registro" class="login-form">
            <h1>FOOD STORE</h1>
            <h2>Crear una cuenta</h2>

            <label for="email">Email:</label>
            <input 
                type="email" 
                id="email" 
                placeholder="ejemplo@correo.com" 
                required>

            <label for="password">Contraseña:</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Mínimo 6 caracteres" 
                minlength="6" 
                required>

            <label>Tipo de Usuario:</label>
            <select id="rol">
            <option value="client">Cliente (Hacer compras)</option>
            <option value="admin">Administrador (Gestionar stock)</option>
            </select>

            <button type="submit">REGISTRARME</button>

            <p class="registro">
                ¿Ya tenés cuenta? <a href="../login/login.html">Inicia sesión aquí</a>
            </p>
        </form>
    </div>
    
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="./registro.ts"></script>
</body>
</html>
